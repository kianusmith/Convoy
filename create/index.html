<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convoy | Create a group trip</title>
  <meta name="description" content="Create a Convoy group trip and get a shared payment link for your friends.">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/pay/pay.css">
  <link rel="stylesheet" href="/create/create.css">
</head>
<body class="pay-page">
  <header class="site-header">
    <a class="brand" href="/" aria-label="Convoy home">
      <span class="brand-mark" aria-hidden="true">C</span>
      <span>Convoy</span>
    </a>
  </header>

  <main>
    <section class="pay-card">
      <p class="eyebrow">Start a group trip</p>
      <h1>Create your payment link</h1>
      <p class="pay-muted">Set the trip details once, then share the link so everyone can pay their share.</p>

      <form class="pay-form create-form" id="create-form" novalidate>
        <div>
          <label for="title">Trip title</label>
          <input id="title" name="title" type="text" placeholder="Barcelona birthday weekend" required>
        </div>

        <div>
          <label for="destination">Destination</label>
          <input id="destination" name="destination" type="text" placeholder="Barcelona, Spain" required>
        </div>

        <div class="create-date-row">
          <div>
            <label for="start_date">Start date <span class="create-optional">(optional)</span></label>
            <input id="start_date" name="start_date" type="date">
          </div>
          <div>
            <label for="end_date">End date <span class="create-optional">(optional)</span></label>
            <input id="end_date" name="end_date" type="date">
          </div>
        </div>

        <div class="create-split-row">
          <div>
            <label for="price_per_person">Cost per person (£)</label>
            <input id="price_per_person" name="price_per_person" type="number" min="1" step="0.01" placeholder="249.00" required>
          </div>
          <div>
            <label for="group_size">Group size</label>
            <input id="group_size" name="group_size" type="number" min="2" step="1" placeholder="8" required>
          </div>
        </div>

        <div>
          <label for="organizer_name">Organiser name</label>
          <input id="organizer_name" name="organizer_name" type="text" autocomplete="name" required>
        </div>

        <div>
          <label for="organizer_email">Organiser email</label>
          <input id="organizer_email" name="organizer_email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </div>

        <button type="submit">Create payment link</button>
        <p class="pay-note" id="form-note" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>
    <span>Convoy</span>
    <span>Group trips, booked together.</span>
  </footer>

  <script src="/create/create.js" type="module"></script>
</body>
</html>
